name: Dependency audits
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - '.'
          - 'demos/steiner-handwerk'
          - 'demos/cafe-vogel'
          - 'demos/salon-lumiere'
          - 'demos/falkenried'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Lockfile audit includes development tools without executing lifecycle scripts.
      - run: npm audit --package-lock-only --audit-level=moderate
