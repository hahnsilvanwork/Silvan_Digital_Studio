name: Dependency audits
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - '.'
          - 'demos/steiner-handwerk'
          - 'demos/cafe-vogel'
          - 'demos/salon-lumiere'
          - 'demos/falkenried'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Lockfile audit includes development tools without executing lifecycle scripts.
      - run: npm audit --package-lock-only --audit-level=moderate
